name: Portal Studio CI

# Goal 05 (G05-07): the CI gate sequence — typecheck, unit/component tests,
# CLI process smoke, Playwright interaction tests, visual snapshots, and the
# production build + Studio-code exclusion scan.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Scoped lint
        run: npx eslint src/studio scripts tests/components/portal-studio tests/logic/portal-studio e2e --max-warnings=0

      - name: Unit / component tests (incl. write-serialization + CLI smoke)
        run: npx vitest run

      - name: SDK tests
        run: pnpm test:sdk

      - name: Production build
        run: pnpm build

      - name: Production Studio-code exclusion scan
        run: |
          total=0
          for marker in ps-tool-action ps-collapsed-chip ps-horizontal-bar ps-list-panel ps-shortcut-help mountPortalStudio StudioToolbar portal-studio-root __PORTAL_STUDIO portalStudioPlugin studio-actions; do
            count=$(grep -rl "$marker" dist/ 2>/dev/null | wc -l)
            echo "$marker: $count"
            total=$((total + count))
          done
          echo "TOTAL LEAKS: $total"
          test "$total" -eq 0
          grep -c "portal-studio" dist/index.html || true

      - name: Playwright interaction tests (incl. Goal 05 visual snapshots)
        run: npx playwright test

      - name: Goal 05 visual snapshots (focused)
        run: npx playwright test -g "G05-06"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-studio-visual
          path: test-results/visual/
