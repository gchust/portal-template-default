name: Portal CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Scoped lint
        run: npx eslint src/agent-feedback tests/logic/agent-feedback e2e --max-warnings=0

      - name: Unit / component tests
        run: npx vitest run

      - name: SDK tests
        run: pnpm test:sdk

      - name: Production build
        run: pnpm build

      - name: Production Agent Feedback exclusion scan
        run: |
          ! grep -rE "agent-feedback-root|__agent-feedback|x-agent-feedback-token|virtual:agent-feedback/client|data-agent-feedback-root|nocobase\.portal|Portal Studio" dist/

      - name: Playwright interaction tests
        run: npx playwright test
